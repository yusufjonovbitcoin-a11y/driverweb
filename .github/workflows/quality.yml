name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Accounting and editable PDF checks
        run: npx playwright test --config playwright.settlements.config.js
      - name: Financial analytics browser checks
        run: npx playwright test --config playwright.financial-center.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock supabase/functions/_shared/*_test.ts
      - name: Gmail lease and approved-sender isolation
        run: PG_BIN="$(pg_config --bindir)" node scripts/test-gmail-cloud-worker-db.mjs
      - name: Isolated chat database regression tests
        run: PG_BIN="$(pg_config --bindir)" npm run test:chat-db
      - name: Driver sheet review and assignment checks
        run: PG_BIN="$(pg_config --bindir)" npm run test:driver-brief-db
      - name: Verify canonical migration ledger
        run: node scripts/verify-migration-ledger.mjs
      - name: Isolated backend integrity regression tests
        env:
          BACKEND_AUDIT_TEST: '1'
          DRIVER_PAY_TEST: '1'
          SECURITY_AUDIT_TEST: '1'
          DOCUMENT_PRIVACY_TEST: '1'
          AUDIT_FIX_TEST: '1'
        run: PG_BIN="$(pg_config --bindir)" node scripts/test-load-trash-db.mjs
      - name: Native incoming call lifecycle and device isolation checks
        run: PG_BIN="$(pg_config --bindir)" npm run test:native-call-db
      - name: Durable settlements and PDF integrity
        run: PG_BIN="$(pg_config --bindir)" npm run test:settlements-db
      - name: Consistent financial snapshot and approved calculation isolation
        run: PG_BIN="$(pg_config --bindir)" npm run test:financial-center-db
      - name: Accounting settings, driver overrides and delivery date checks
        run: PG_BIN="$(pg_config --bindir)" node scripts/test-settlement-settings-db.mjs
      - name: MFA enforcement regression
        run: PG_BIN="$(pg_config --bindir)" node scripts/test-mfa-db.mjs
      - name: Driver earnings recipient and delivery isolation
        run: PG_BIN="$(pg_config --bindir)" node scripts/test-earnings-db.mjs
