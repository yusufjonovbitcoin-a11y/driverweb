project_id = "apexhaul-core"

[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/app", "io.supabase.apexhaul://login-callback"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[functions.create-member]
verify_jwt = true

[functions.create-company]
verify_jwt = true

[functions.lookup-load-contacts]
verify_jwt = true

[functions.parse-load-document]
verify_jwt = true

[functions.check-load-document]
verify_jwt = true
