project_id = "apexhaul-core"

[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/app", "io.supabase.apexhaul://login-callback"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[functions.create-member]
verify_jwt = true

[functions.create-company]
verify_jwt = true

[functions.lookup-load-contacts]
verify_jwt = true

[functions.parse-load-document]
verify_jwt = true

[functions.check-load-document]
# Explicit user getUser + RLS, or a dedicated Cron worker token, inside handler.
verify_jwt = false

[functions.calculate-load-route]
verify_jwt = true

[functions.calculate-driver-start-pay]
# Explicit getUser + assignment RLS, or a dedicated constant-time Cron token.
verify_jwt = false

[functions.decode-vin]
verify_jwt = true

[functions.ask-load-ai]
verify_jwt = true

[functions.forward-gmail-attachment]
verify_jwt = true

[functions.gmail-integration]
verify_jwt = true

[functions.gmail-sync-worker]
# Server-role-only handler, plus global and company switches off by default.
# Deploying this function does NOT schedule or enable Gmail processing.
verify_jwt = true

[functions.process-broker-attachment]
verify_jwt = false

[functions.cloudinary-media]
verify_jwt = false

[functions.process-push-notifications]
verify_jwt = false

[functions.process-media-deletions]
verify_jwt = false


[functions.process-native-call-push]
# Scoped no-secret wake or existing trusted Cron token; only server-owned outbox.
verify_jwt = false

[functions.native-call-action]
# Short-lived HMAC capability; decline/status only, never unauthenticated accept.
verify_jwt = false
